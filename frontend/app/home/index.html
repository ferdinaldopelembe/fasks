<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fasks</title>
        <!-- FontAwesome -->
        <link rel="stylesheet" href="./../../assets/fontawesome/css/all.css" />
        <!-- Style -->
        <link rel="stylesheet" href="./css/style.css" />
        <!-- Script -->
        <script defer type="module" src="./js/script.js"></script>
    </head>
    <body>
        <script type="module">
            import {
                handleUserAuthenctication,
                isUserAuthenticated
            } from "./js/imports/auth.js";

            if (!(await isUserAuthenticated())) {
                handleUserAuthenctication();
            } else {
                document.body.style.display = 'flex';
            }
        </script>
        <div id="side-menu" class="side-menu-compact">
            <div class="logo">
                <span class="logo-text">FA</span>
                <div class="app-description hidden">
                    <b>Fasks</b>
                    <p>Make it ease</p>
                </div>
            </div>
            <button class="toggle-menu">
                <i class="toggle-menu-icon fa-solid fa-chevron-right"></i>
            </button>
            <div class="menu-buttons">
                <button title="Home" class="menu-button selected" destination="home">
                    <i style="margin-top: -1px" class="fa-regular fa-home"></i>
                    <span class="menu-button-title hidden">Home</span>
                </button>
                <button title="Completed Tasks" class="menu-button" destination="completed">
                    <i class="fa-regular fa-circle-check"></i>
                    <span class="menu-button-title hidden">Completed</span>
                </button>
            </div>
            <button class="theme-button">
                <span class="theme-circle"></span>
            </button>
        </div>
        <div id="home" class="page">
            <header class="page-header">
                <h2>All Tasks</h2>
                <div class="proffile" title="logout">
                    <i class="fa fa-sign-out"></i>
                </div>
            </header>
            <!-- All Tasks Container -->
            <div class="tasks-container">
                <!-- <div class="gradient-scroll"></div> -->
                <div class="loading">
                    <p>Carregando Tarefas</p>
                    <div class="loading-balls">
                        <span id="ball-1"></span>
                        <span id="ball-2"></span>
                        <span id="ball-3"></span>
                        <!-- <span></span>
                        <span></span> -->
                    </div>
                </div>
            </div>

            <!-- Cirlce Create Button -->
            <button title="Add Task" class="create-task">
                <i class="fa-solid fa-plus"></i>
            </button>

            <!-- Create Task Form -->
            <div class="create-task-form hidden">
                <form class="form" id="form">
                    <h2>New Task</h2>
                    <div class="input-container">
                        <label for="title">Title</label>
                        <input placeholder="eg: go to the gym..." required class="title" id="title" type="text" />
                    </div>
                    <div class="input-container">
                        <label for="description">Desciption</label>
                        <textarea
                            required
                            class="description"
                            id="description"
                            placeholder="eg: go to the gym at 6:00 PM, don't forget to bring your water bottle and towel..."
                        ></textarea>
                    </div>
                    <div class="action-buttons">
                        <button id="create-button" type="submit">create</button>
                        <button id="cancel-button" type="button">cancel</button>
                    </div>
                    <!-- <button class="close-form-button"></button> -->
                </form>
            </div>

        </div>
        <div id="completed" class="page hidden">
            <header class="page-header">
                <h2>Completed Tasks</h2>
                <div class="proffile">
                    <i class="fa fa-sign-out"></i>
                </div>
            </header>
            <!-- Tasks -->
            <div class="completed-tasks-container"></div>
        </div>
    </body>
</html>
